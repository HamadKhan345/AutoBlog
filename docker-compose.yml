version: "3.9"

services:
  db:
    image: postgres:17
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    env_file: .env
    command: ["gunicorn", "-c", "gunicorn.conf.py", "AutoBlog.asgi:application"]
    depends_on:
      - db
    ports:
      - "80:8000"
    volumes:
      - media_volume:/app/media
    environment:
      - GUNICORN_WORKERS=1
      - GUNICORN_TIMEOUT=300

volumes:
  postgres_data:
  media_volume:
